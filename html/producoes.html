<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Produções | STANCE Planner</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- MENU -->
        <aside class="col-md-2 bg-dark text-white vh-100 p-4">

            <h2 class="text-center mb-5">
                STANCE
            </h2>

            <div class="d-grid gap-2">

                <a
                    href="dashboard.html"
                    class="btn btn-outline-light"
                >
                    🏠 Dashboard
                </a>

                <a
                    href="index.html"
                    class="btn btn-outline-light"
                >
                    📅 Agenda
                </a>

                <a
                    href="producoes.html"
                    class="btn btn-primary"
                >
                    🎬 Produções
                </a>

                <a
                    href="clientes.html"
                    class="btn btn-outline-light"
                >
                    👥 Clientes
                </a>

                <a
                    href= "relatorios.html"
                    class="btn btn-outline-light"
                >
                    📊 Relatórios
                </a>

                <a
                    href="configuracoes"
                    class="btn btn-outline-light"
                >
                    ⚙️ Configurações
                </a>

            </div>

        </aside>


        <!-- CONTEÚDO -->
        <main class="col-md-10 p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h1>
                        🎬 Produções
                    </h1>

                    <p class="text-muted">
                        Gerencie todas as produções da STANCE.
                    </p>

                </div>

                <a
                    href="index.html"
                    class="btn btn-success"
                >
                    ➕ Nova Produção
                </a>

            </div>


            <!-- CONTADORES -->

            <div class="row g-4 mb-4">

                <div class="col-md-4">

                    <div class="card shadow-sm border-0">

                        <div class="card-body">

                            <h6 class="text-muted">
                                Total
                            </h6>

                            <h2 id="totalProducoes">
                                0
                            </h2>

                        </div>

                    </div>

                </div>


                <div class="col-md-4">

                    <div class="card shadow-sm border-0">

                        <div class="card-body">

                            <h6 class="text-muted">
                                Pendentes
                            </h6>

                            <h2 id="pendentesProducoes">
                                0
                            </h2>

                        </div>

                    </div>

                </div>


                <div class="col-md-4">

                    <div class="card shadow-sm border-0">

                        <div class="card-body">

                            <h6 class="text-muted">
                                Concluídas
                            </h6>

                            <h2 id="concluidasProducoes">
                                0
                            </h2>

                        </div>

                    </div>

                </div>

            </div>


            <!-- LISTA -->

            <div class="card shadow-sm border-0">

                <div class="card-body">

                    <h4 class="mb-4">
                        Todas as Produções
                    </h4>

                    <div
                        id="listaProducoes"
                        class="row g-3"
                    >

                        <p class="text-muted">
                            Carregando produções...
                        </p>

                    </div>

                </div>

            </div>

        </main>

    </div>

</div>


<script src="../js/producoes.js"></script>

</body>

</html>
