<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Relatórios | STANCE Planner</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- MENU -->
        <aside class="col-md-2 bg-dark text-white vh-100 p-4">

            <h2 class="text-center mb-5">
                STANCE
            </h2>

            <div class="d-grid gap-2">

                <a 
                        href="dashboard.html" 
                        class="btn btn-outline-light">

                    🏠 Dashboard

                </a>

                <a      href="index.html"
                        class="btn btn-outline-light">

                    📅 Agenda

                </a>

                <a      href="producoes.html" 
                        class="btn btn-outline-light">

                    🎬 Produções

                </a>

                <a 
                        href="clientes.html" 
                        class="btn btn-outline-light">
                        
                    👥 Clientes

                </a>

                <a 
                        href="relatorios.html" 
                        class="btn btn-primary">

                    📊 Relatórios

                </a>

                <a      
                        href="configurancoes.html" 
                        class="btn btn-outline-light">

                    ⚙️ Configurações


                </a>

            </div>

        </aside>


        <!-- CONTEÚDO -->
        <main class="col-md-10 p-4">

            <div class="mb-4">

                <h1>📊 Relatórios</h1>

                <p class="text-muted">
                    Acompanhe um resumo das atividades da STANCE.
                </p>

            </div>


            <!-- CARDS -->
            <div class="row g-4 mb-4">

                <div class="col-md-4">

                    <div class="card shadow-sm border-0">
                        <div class="card-body">

                            <h6 class="text-muted">
                                Total de Produções
                            </h6>

                            <h2 id="relatorioProducoes">
                                0
                            </h2>

                        </div>
                    </div>

                </div>


                <div class="col-md-4">

                    <div class="card shadow-sm border-0">
                        <div class="card-body">

                            <h6 class="text-muted">
                                Produções Concluídas
                            </h6>

                            <h2 id="relatorioConcluidas">
                                0
                            </h2>

                        </div>
                    </div>

                </div>


                <div class="col-md-4">

                    <div class="card shadow-sm border-0">
                        <div class="card-body">

                            <h6 class="text-muted">
                                Total de Clientes
                            </h6>

                            <h2 id="relatorioClientes">
                                0
                            </h2>

                        </div>
                    </div>

                </div>

            </div>


            <!-- RESUMO -->
            <div class="card shadow-sm border-0">

                <div class="card-body">

                    <h4 class="mb-4">
                        📈 Resumo Geral
                    </h4>

                    <div id="resumoRelatorio">

                        <p class="text-muted">
                            Carregando informações...
                        </p>

                    </div>

                </div>

            </div>

        </main>

    </div>
</div>


<script src="../js/relatorios.js"></script>

</body>
</html>
