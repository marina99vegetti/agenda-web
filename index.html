<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Agenda</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;

    background: radial-gradient(circle at center, 
        #123b8f 0%, 
        #0d2c6c 30%, 
        #081f4d 60%, 
        #030f2e 100%
    );

    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
}

.urgent {
    border-left: 6px solid #ff4d4d;
}

.medium {
    border-left: 6px solid #ffa502;
}

.normal {
    border-left: 6px solid #2ed573;
}

.tag {
    font-size: 10px;
    padding: 3px 6px;
    border-radius: 6px;
    color: white;
    margin-left: 8px;
}

.tag.urgent {
    background: #ff4d4d;
}

.tag.medium {
    background: #ffa502;
}

.tag.normal {
    background: #2ed573;
}

/* CARD PRINCIPAL */
.container {
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);

    background-image: url('01.png');
    background-repeat: no-repeat;
    background-position: center;
    background-size: 200px;

    max-height: none;
    overflow: visible;
}
.container {
    
    background: rgba(255, 255, 255, 0.15); /* transparente */
    backdrop-filter: blur(12px);

    border-radius: 20px;

    box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.3);
    
    border: 1px solid rgba(255,255,255,0.2);
}

/* TÍTULO */
h1 {
    text-align: center;
    margin-bottom: 10px;
    color: white;
}
h1 {
    color: white;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
    filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4));
}
.logo {
    display: block;
    margin: 0 auto 15px;
    width: 200px;
}

/* CALENDÁRIO MINI */
#calendario {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    margin: 10px 0;
}

.dia {
    background: #f1f1f1;
    padding: 6px;
    font-size: 11px;
    text-align: center;
    border-radius: 6px;
    cursor: pointer;
}

.dia:hover {
    background: #dfe6ff;
}

.ativo {
    background: #6c5ce7;
    color: white;
}



/* INPUT */
input {

    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
    outline: none;
}

/* BOTÃO */
button {
    padding: 10px;
    background: #6c5ce7;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

#mesTitulo {
    color: white;
    font-weight: bold;
}
/* TAREFAS */
.task {
    background: #f8f9ff;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 6px solid transparent;

    box-shadow: 
        0 4px 8px rgba(0,0,0,0.1);

    transition: 0.2s;
}

.task:hover {
    transform: scale(1.02);
    box-shadow: 
        0 8px 15px rgba(0,0,0,0.2);
}

.task.urgent {
    border-left-color: #ff4d4d;
}

.task.medium {
    border-left-color: #ffa502;
}

.task.normal {
    border-left-color: #2ed573;
}

.done {
    text-decoration: line-through;
    opacity: 0.5;
}

#msg {
    display: none;
    color: red;
    font-size: 14px;
}

.done span {
    position: relative;
    color: #999;
}

.done span::after {
    content: "";
    position: absolute;
    left: 0;
    top: 50%;
    width: 0%;
    height: 2px;
    background: #999;
    transform: translateY(-50%);
    transition: width 0.4s ease;
}

.done span::after {
    width: 100%;
    display: none;
    color: red;
    font-size: 14px;
}

.done {
    opacity: 0.6;
    transition: 0.3s;
}

.cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
}

.dia-box {
    background: #f1f1f1;
    border-radius: 10px;
    padding: 5px;
    min-height: 80px;
    position: relative;
}

.dia-box {
    background: #f1f1f1;
    border-radius: 10px;
    padding: 5px;
    min-height: 80px;

    box-shadow: 
        0 4px 10px rgba(0,0,0,0.1);

    backdrop-filter: blur(3px);

    transition: 0.2s;
}

.dia-box:hover {
    transform: translateY(-3px);
    box-shadow: 
        0 8px 20px rgba(0,0,0,0.2);
}

.evento {
    font-size: 10px;
    padding: 3px;
    border-radius: 5px;
    margin-top: 3px;
    color: white;
}

.evento.urgent { background: #ff4d4d; }
.evento.medium { background: #ffa502; }
.evento.normal { background: #2ed573; }

#contador {
    color: white;
    text-align: center;
    margin-top: 10px;
}

.bg-logo {
    position: absolute;
    opacity: 0.05;
    width: 300px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

/*destacar dia*/
.hoje {
    border: 2px solid #6c5ce7;
    background: #dfe6ff;
    box-shadow: 0 0 10px rgba(108,92,231,0.6);
}

button {
    transition: 0.2s;
}

button:hover {
    transform: scale(1.1);
}

.btn-check {
    background: #ffffff;
    color: #2ed573;
    border: 2px solid #2ed573;
    border-radius: 6px;
    width: 28px;
    height: 28px;
    cursor: pointer;
}

.btn-check:hover {
    background: #2ed573;
    color: white;
}

.task-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.btn-check {
    display: flex;
    align-items: center;
    justify-content: center;
}

.dia-box.dragover {
    background: #c7d2ff;
    transform: scale(1.05);
}

</style>
</head>

<body>

<div class="container">
   <img src="01.png" class="bg-logo">
   <img src="logo.png/01.png" class="logo">
    <h1>AGENDA STANCE</h1>

    <!-- CALENDÁRIO -->
<div class="topo">
    <button id="btnAnterior">◀</button>
    <h3 id="mesTitulo"></h3>
    <button id="btnProximo">▶</button>
</div>

    <div id="calendario"></div>
    <p id="dataSelecionada"></p>

   <input id="tarefa" placeholder="Digite uma tarefa">
   <input type="time" id="hora">
   <input id="obs" placeholder="Observação (opcional)">

<select id="priority">
    <option value="normal">Normal</option>
    <option value="medium">Médio</option>
    <option value="urgent">Urgente</option>
</select>

<button onclick="add()">Adicionar</button>

    <p id="msg"></p>

    <p id="contador"></p>

    <div id="lista"></div>

</div>

<script>
const API = "https://agenda-api-f6vu.onrender.com/tasks";

let dataSelecionada = new Date().toISOString().split("T")[0];

let dataAtual = new Date();
let anoAtual = dataAtual.getFullYear();
let mesAtual = dataAtual.getMonth();

// botões mês
document.getElementById("btnAnterior").addEventListener("click", () => {
    mesAtual--;
    if (mesAtual < 0) {
        mesAtual = 11;
        anoAtual--;
    }
    gerarCalendario();
    carregar();
});

document.getElementById("btnProximo").addEventListener("click", () => {
    mesAtual++;
    if (mesAtual > 11) {
        mesAtual = 0;
        anoAtual++;
    }
    gerarCalendario();
    carregar();
});

// CALENDÁRIO
async function gerarCalendario() {
    const cal = document.getElementById("calendario");
    cal.innerHTML = "";
    cal.className = "cal-grid";

    // evita cache
    const res = await fetch(API + "?t=" + new Date().getTime());
    const dados = await res.json();

    const meses = [
        "Janeiro","Fevereiro","Março","Abril","Maio","Junho",
        "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"
    ];

    document.getElementById("mesTitulo").innerText =
        `${meses[mesAtual]} ${anoAtual}`;

    const totalDias = new Date(anoAtual, mesAtual + 1, 0).getDate();

    for (let d = 1; d <= totalDias; d++) {
        const data = `${anoAtual}-${String(mesAtual+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

        const box = document.createElement("div");
        box.className = "dia-box";

        // hoje
        const hoje = new Date().toISOString().split("T")[0];
        if (data === hoje) box.classList.add("hoje");

        // drag
        box.addEventListener("dragover", (e) => e.preventDefault());

        box.addEventListener("dragenter", () => {
            box.classList.add("dragover");
        });

        box.addEventListener("dragleave", () => {
            box.classList.remove("dragover");
        });

        box.addEventListener("drop", async (e) => {
            const id = e.dataTransfer.getData("id");

            await fetch(`${API}/${id}`, {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ date: data })
            });

            box.classList.remove("dragover");

            await gerarCalendario();
            await carregar();
        });

        const titulo = document.createElement("strong");
        titulo.innerText = d;
        box.appendChild(titulo);

        const tarefasDoDia = dados.filter(t => t.date === data);

        tarefasDoDia.forEach(t => {
            const ev = document.createElement("div");
            ev.className = `evento ${t.priority || "normal"}`;
            ev.innerText = `${t.time || "--:--"} - ${t.title}`;
            box.appendChild(ev);
        });

        box.onclick = () => {
            dataSelecionada = data;
            carregar();
        };

        cal.appendChild(box);
    }
}

// ADICIONAR
async function add() {
    const tarefa = document.getElementById("tarefa").value;
    const priority = document.getElementById("priority").value;
    const hora = document.getElementById("hora").value;
    const obs = document.getElementById("obs").value;
    const msg = document.getElementById("msg");

    if (!tarefa) {
        msg.style.display = "block";
        msg.innerText = "Preencha tudo!";
        return;
    }

    msg.style.display = "none";

    await fetch(API, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            title: tarefa,
            date: dataSelecionada,
            time: hora,
            priority: priority,
            obs: obs
        })
    });

    document.getElementById("tarefa").value = "";
    document.getElementById("hora").value = "";
    document.getElementById("obs").value = "";

    await carregar();
    await gerarCalendario();
}

// LISTA
async function carregar() {
    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    const res = await fetch(API + "?t=" + new Date().getTime());
    const dados = await res.json();

    const tarefasDoDia = dados.filter(t => t.date === dataSelecionada);

    tarefasDoDia.forEach(t => {
        const div = document.createElement("div");
        div.className = `task ${t.priority || "normal"}`;
        div.setAttribute("data-id", t.id);
        div.setAttribute("draggable", true);

        if (t.done === true) div.classList.add("done");

        div.innerHTML = `
            <div class="task-left">
                <button class="btn-check" onclick="toggle(${t.id})">✔</button>
                <span>${t.time || "--:--"} - ${t.title}</span>
                ${t.obs ? `<small style="display:block; margin-top:5px; opacity:0.6;">${t.obs}</small>` : ""}
            </div>
            <div>
                <button onclick="editar(${t.id})">✏️</button>
                <button onclick="del(${t.id})">🗑</button>
            </div>
        `;

        // DRAG CORRETO
        div.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("id", t.id);
        });

        lista.appendChild(div);
    });

    document.getElementById("dataSelecionada").innerText =
        "Data: " + dataSelecionada;
}

// TOGGLE
async function toggle(id) {
    const el = document.querySelector(`[data-id="${id}"]`);
    el.classList.toggle("done");

    const isDone = el.classList.contains("done");

    await fetch(`${API}/${id}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ done: isDone })
    });
}

// DELETE
async function del(id) {
    const el = document.querySelector(`[data-id="${id}"]`);

    el.style.opacity = "0";
    el.style.transform = "translateX(20px)";

    setTimeout(() => el.remove(), 200);

    await fetch(`${API}/${id}`, { method: "DELETE" });

    await gerarCalendario();
}

// EDITAR
async function editar(id) {
    const res = await fetch(API);
    const dados = await res.json();

    const tarefa = dados.find(t => t.id === id);

    const novoTitulo = prompt("Editar tarefa:", tarefa.title);
    if (novoTitulo === null) return;

    const novaHora = prompt("Editar hora:", tarefa.time || "");
    const novaObs = prompt("Observação:", tarefa.obs || "");

    await fetch(`${API}/${id}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            title: novoTitulo,
            time: novaHora,
            obs: novaObs
        })
    });

    await carregar();
    await gerarCalendario();
}

// INIT
document.addEventListener("DOMContentLoaded", () => {
    carregar();
    gerarCalendario();
});
</script>
